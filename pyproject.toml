[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enso-atlas"
version = "0.1.0"
description = "On-prem pathology evidence engine for treatment-response insight"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hanson Wen", email = "hansonwen@berkeley.edu"},
]
keywords = ["pathology", "medical-ai", "whole-slide-imaging", "deep-learning"]

dependencies = [
    # Core
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "h5py>=3.9.0",

    # WSI Processing
    "openslide-python>=1.3.0",

    # Deep Learning
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=5.0.0rc3,<6.0.0",
    "huggingface-hub>=1.5.0,<2.0.0",
    "sentencepiece>=0.1.99",

    # MIL & Pathology
    "slideflow>=2.3.0",

    # Vector Search
    "faiss-cpu>=1.7.4",

    # LLM
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",

    # UI
    "gradio>=4.0.0",

    # API
    "fastapi>=0.109.0",
    "python-multipart>=0.0.6",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.12.0,<3.0.0",

    # Database
    "asyncpg>=0.29.0",

    # PDF Generation
    "reportlab>=4.4.0,<5.0.0",
    "fpdf2>=2.7.0",

    # Utilities
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]
gpu = [
    "faiss-gpu>=1.7.4",
    "cucim>=24.2.0",
]

[project.scripts]
enso-atlas = "enso_atlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/enso_atlas"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    # Black-compatible style: long strings/comments are not always safely reflowable.
    "E501",
    # Scientific/ML code conventionally uses uppercase tensor and matrix names.
    "N806",
    # Several modules intentionally initialize paths/backends before late imports.
    "E402",
    # PyTorch convention: import torch.nn.functional as F.
    "N812",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
